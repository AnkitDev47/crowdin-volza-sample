
name: Crowdin AI Translation

on:
  push:
    branches:
      - main
    paths:
      - 'src/locales/en.json'
      - 'crowdin.yml'
      - '.github/workflows/crowdin-translate.yml'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-ai-translation
  cancel-in-progress: false

jobs:
  translate:
    name: Sync and translate with Crowdin AI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Crowdin configuration
        run: |
          echo "Working directory:"
          pwd
          echo "Crowdin configuration:"
          cat -n crowdin.yml
          echo "Validating YAML..."
          ruby -e 'require "yaml"; YAML.load_file("crowdin.yml"); puts "YAML is valid"'

      - name: Upload English source
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: false
          create_pull_request: false
          push_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Run AI auto-translation
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          command: 'auto-translate'
          command_args: '--method ai --ai-prompt=${{ secrets.PROMPT_ID }}'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download translations and open PR
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_ai_translations
          create_pull_request: true
          pull_request_title: 'Crowdin AI translations'
          pull_request_body: |
            Automated translations generated by the configured
            Crowdin AI prompt. Please review before merging.
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
